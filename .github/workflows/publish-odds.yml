name: Publish league odds

# Manual fallback only. The server publishes around the clock (serve.py under systemd, server/cg-live.service); run
# this only while that is down, or both will push. A run in a game window stays up and publishes every 2 min (loop.py).
on:
  workflow_dispatch:
    inputs:
      handoff:
        description: "Set by loop.py when it hands the game window to a fresh run"
        required: false
        default: "false"

permissions:
  contents: write                # loop.py commits the status and lineup logs
  actions: write                 # gate.py reads the run list; loop.py starts its replacement at the time limit

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      TZ: America/New_York       # game days are Eastern dates
    steps:
      - uses: actions/checkout@v4

      - name: Game hours?
        id: gate
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HANDOFF: ${{ inputs.handoff }}
        run: python3 gate.py

      - name: Check out the page repo
        if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@v4
        with:
          repository: thewhitelisted/cg-531d2447
          token: ${{ secrets.PAGES_TOKEN }}
          path: page

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: "3.13"
          cache: pip

      - run: pip install -r requirements.txt
        if: steps.gate.outputs.run == 'true'

      - name: ESPN login and publish config
        if: steps.gate.outputs.run == 'true'
        env:
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          ESPN_SWID: ${{ secrets.ESPN_SWID }}
        run: |
          python - <<'PY'
          import json, os
          json.dump({"espn_s2": os.environ["ESPN_S2"], "SWID": os.environ["ESPN_SWID"]}, open("data/espn_auth.json", "w"))
          json.dump({"repo_dir": "page"}, open("data/publish.json", "w"))
          PY
          git -C page config user.name "cg-engine"
          git -C page config user.email "cg-engine@users.noreply.github.com"

      - name: Refresh odds and publish (every 2 min through the game window)
        if: steps.gate.outputs.run == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python loop.py
